# kcov-dataflow CI
#
# Pipeline:
#   build (x86_64 + arm64)  ->  test (x86_64, x86_64-rt, arm64, arm64-rt)
#
# Why custom toolchain:
#   - LLVM: contains trace-args/trace-ret SanitizerCoverage passes (not in upstream)
#   - rustc: built against custom LLVM so Rust .ko modules get the passes natively
#
# Runners:
#   - x86_64: ubuntu-latest (KVM available)
#   - arm64:  ubuntu-24.04-arm (TCG only, no KVM on GitHub arm64 runners)
#
# Rust kernel modules only build on non-RT (CONFIG_PREEMPT_RT conflicts with CONFIG_RUST)

name: kcov-dataflow kselftest

on:
  push:
    branches: [main, kcov-dataflow-*]
  pull_request:

jobs:
  # Stage 1: Build custom LLVM + rustc (per architecture)
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: X86
            rust-target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: AArch64
            rust-target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Clone submodules (shallow)
      run: git submodule update --init --depth 1 llvm-project rust

    - name: Install build deps
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld ninja-build cmake python3

    - name: Get submodule commits
      id: revs
      run: |
        echo "llvm=$(git rev-parse HEAD:llvm-project)" >> $GITHUB_OUTPUT
        echo "rust=$(git rev-parse HEAD:rust)" >> $GITHUB_OUTPUT

    - name: Cache LLVM build
      id: cache-llvm
      uses: actions/cache@v4
      with:
        path: llvm-project/build
        key: llvm-${{ matrix.arch }}-${{ steps.revs.outputs.llvm }}

    - name: Build custom LLVM
      if: steps.cache-llvm.outputs.cache-hit != 'true'
      run: |
        cd llvm-project
        cmake -S llvm -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DLLVM_ENABLE_LLD=ON \
          -DLLVM_ENABLE_PROJECTS="clang;lld" \
          -DLLVM_TARGETS_TO_BUILD="${{ matrix.target }}"
        ninja -C build

    - name: Cache Rust build
      id: cache-rust
      uses: actions/cache@v4
      with:
        path: rust/build/${{ matrix.rust-target }}/stage1
        key: rust-${{ matrix.arch }}-${{ steps.revs.outputs.rust }}-${{ steps.revs.outputs.llvm }}

    - name: Build custom rustc (stage1)
      if: steps.cache-rust.outputs.cache-hit != 'true'
      run: |
        cd rust
        cat > config.toml << EOF
        [llvm]
        download-ci-llvm = false
        [build]
        target = ["${{ matrix.rust-target }}"]
        docs = false
        extended = false
        [target.${{ matrix.rust-target }}]
        llvm-config = "$PWD/../llvm-project/build/bin/llvm-config"
        cc = "$PWD/../llvm-project/build/bin/clang"
        cxx = "$PWD/../llvm-project/build/bin/clang++"
        [rust]
        codegen-backends = ["llvm"]
        debug-assertions = false
        channel = "nightly"
        EOF
        python3 x.py build --stage 1 library

    - name: Upload toolchain
      uses: actions/upload-artifact@v4
      with:
        name: toolchain-${{ matrix.arch }}
        path: |
          llvm-project/build/bin
          llvm-project/build/lib
          rust/build/${{ matrix.rust-target }}/stage1
        retention-days: 1

  # Stage 2: Build kernel and run selftests
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            arch: x86_64
            runner: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            rt: false
          - name: x86_64-rt
            arch: x86_64
            runner: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            rt: true
          - name: arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            rt: false
          - name: arm64-rt
            arch: arm64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            rt: true
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Clone linux submodule (shallow)
      run: git submodule update --init --depth 1 linux rust

    - name: Download toolchain
      uses: actions/download-artifact@v4
      with:
        name: toolchain-${{ matrix.arch }}

    - name: Fix permissions
      run: |
        chmod +x llvm-project/build/bin/*
        chmod +x rust/build/${{ matrix.rust-target }}/stage1/bin/*

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential bc flex bison libelf-dev libssl-dev \
          python3 qemu-system libdw-dev zstd
        # Rustup + bindgen for CONFIG_RUST kernel build
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        source "$HOME/.cargo/env"
        cargo install bindgen-cli
        # virtme-ng for kernel boot testing
        python3 -m venv venv-virtme
        source venv-virtme/bin/activate
        pip3 install git+https://github.com/arighi/virtme-ng.git

    - name: Enable KVM
      if: matrix.arch == 'x86_64'
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Build kernel (${{ matrix.name }})
      run: |
        export PATH="$PWD/llvm-project/build/bin:$PATH"
        export RUSTC="$PWD/rust/build/${{ matrix.rust-target }}/stage1/bin/rustc"
        export RUST_LIB_SRC="$PWD/rust/library"
        source venv-virtme/bin/activate
        cd linux

        EXTRA_CONFIGS=""
        if [ "${{ matrix.rt }}" = "true" ]; then
          EXTRA_CONFIGS="--configitem CONFIG_PREEMPT_RT=y"
        fi
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          # Disable 32-bit compat to avoid needing ARM LLVM target for vdso32
          EXTRA_CONFIGS="$EXTRA_CONFIGS --configitem CONFIG_COMPAT=n"
        fi

        # Only enable Rust for non-RT
        RUST_CONFIGS=""
        if [ "${{ matrix.rt }}" != "true" ] && \
           make LLVM=1 RUSTC=$RUSTC RUST_LIB_SRC=$RUST_LIB_SRC rustavailable 2>/dev/null; then
          RUST_CONFIGS="--configitem CONFIG_RUST=y"
        fi

        vng --build \
          --configitem CONFIG_KCOV=y \
          --configitem CONFIG_KCOV_DATAFLOW_ARGS=y \
          --configitem CONFIG_KCOV_DATAFLOW_RET=y \
          --configitem CONFIG_KCOV_DATAFLOW_INSTRUMENT_ALL=y \
          --configitem CONFIG_DEBUG_INFO=y \
          --configitem CONFIG_DEBUG_INFO_DWARF5=y \
          $RUST_CONFIGS \
          $EXTRA_CONFIGS \
          LLVM=1 CC=clang RUSTC=$RUSTC RUST_LIB_SRC=$RUST_LIB_SRC

    - name: Build selftests
      run: |
        export PATH="$PWD/llvm-project/build/bin:$PATH"
        export RUSTC="$PWD/rust/build/${{ matrix.rust-target }}/stage1/bin/rustc"
        export RUST_LIB_SRC="$PWD/rust/library"
        cd linux

        MAKE_ARGS="LLVM=1 CC=clang RUSTC=$RUSTC RUST_LIB_SRC=$RUST_LIB_SRC"

        # Build user_ioctl (native)
        make -C tools/testing/selftests/kcov_dataflow

        # C module
        make $MAKE_ARGS \
          M=tools/testing/selftests/kcov_dataflow/eight_args_c modules

        # Rust modules (non-RT only)
        if [ "${{ matrix.rt }}" != "true" ] && \
           make $MAKE_ARGS rustavailable 2>/dev/null; then
          make $MAKE_ARGS \
            M=tools/testing/selftests/kcov_dataflow/eight_args_rust modules
          make $MAKE_ARGS \
            M=tools/testing/selftests/kcov_dataflow/rust_ffi_contract modules
        fi

    # --- Test execution (native on both arches) ---

    - name: Run user_ioctl selftest
      run: |
        source venv-virtme/bin/activate
        cd linux
        SELFTEST=tools/testing/selftests/kcov_dataflow
        vng --user root --exec $SELFTEST/user_ioctl/user_ioctl \
          | tee /tmp/user_ioctl_result.txt

    - name: Run eight_args_c selftest
      run: |
        source venv-virtme/bin/activate
        cd linux
        SELFTEST=tools/testing/selftests/kcov_dataflow
        vng --user root \
          --exec "python3 $SELFTEST/trigger-view.py \
            eight_args_c -C 8 --ko $SELFTEST/eight_args_c/eight_args_c.ko" \
          | tee /tmp/eight_args_c_result.txt

    - name: Run eight_args_rust selftest
      run: |
        source venv-virtme/bin/activate
        cd linux
        SELFTEST=tools/testing/selftests/kcov_dataflow
        if [ ! -f $SELFTEST/eight_args_rust/eight_args_rust.ko ]; then
          echo "# Captured 0 records (rustc not available, skipped)" \
            > /tmp/eight_args_rust_result.txt
          exit 0
        fi
        vng --user root \
          --exec "python3 $SELFTEST/trigger-view.py \
            eight_args_rust -C 8 --ko $SELFTEST/eight_args_rust/eight_args_rust.ko" \
          | tee /tmp/eight_args_rust_result.txt

    - name: Run rust_ffi_contract selftest
      run: |
        source venv-virtme/bin/activate
        cd linux
        SELFTEST=tools/testing/selftests/kcov_dataflow
        if [ ! -f $SELFTEST/rust_ffi_contract/rust_ffi_contract.ko ]; then
          echo "# Captured 0 records (rustc not available, skipped)" \
            > /tmp/rust_ffi_result.txt
          exit 0
        fi
        vng --user root \
          --exec "python3 $SELFTEST/trigger-view.py \
            rust_ffi_contract -C 8 --ko $SELFTEST/rust_ffi_contract/rust_ffi_contract.ko" \
          | tee /tmp/rust_ffi_result.txt

    # --- Results ---

    - name: Report results
      if: always()
      run: |
        echo "============================================"
        echo "  KCOV-DATAFLOW RESULTS: ${{ matrix.name }}"
        echo "============================================"
        echo ""
        echo "--- user_ioctl (TAP) ---"
        grep -E "^(ok|not ok|#|PASSED|FAILED|TAP)" /tmp/user_ioctl_result.txt 2>/dev/null || echo "MISSING"
        echo ""
        echo "--- eight_args_c ---"
        cat /tmp/eight_args_c_result.txt 2>/dev/null || echo "MISSING"
        echo ""
        echo "--- eight_args_rust ---"
        cat /tmp/eight_args_rust_result.txt 2>/dev/null || echo "MISSING"
        echo ""
        echo "--- rust_ffi_contract ---"
        cat /tmp/rust_ffi_result.txt 2>/dev/null || echo "MISSING"
        echo ""
        echo "============================================"

    - name: Verify pass
      run: |
        # Verify each test produced expected output
        grep -qiE "PASSED|ok [0-9]" /tmp/user_ioctl_result.txt || \
          { echo "FAIL: user_ioctl did not pass"; exit 1; }
        grep -q "Captured" /tmp/eight_args_c_result.txt || \
          { echo "FAIL: eight_args_c no captures"; exit 1; }
        grep -q "showing [1-9]" /tmp/eight_args_c_result.txt || \
          { echo "FAIL: eight_args_c no context records shown"; exit 1; }
        grep -qE "Captured|skipped" /tmp/eight_args_rust_result.txt || \
          { echo "FAIL: eight_args_rust"; exit 1; }
        grep -qE "Captured|skipped" /tmp/rust_ffi_result.txt || \
          { echo "FAIL: rust_ffi_contract"; exit 1; }
        echo "All tests passed (${{ matrix.name }})"
