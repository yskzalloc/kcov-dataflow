# kcov-dataflow CI
#
# Pipeline:
#   build (x86_64 + arm64)  ->  test (x86_64, x86_64-rt, arm64, arm64-rt)
#
# Why custom toolchain:
#   - LLVM: contains trace-args/trace-ret SanitizerCoverage passes (not in upstream)
#   - rustc: built against custom LLVM so Rust .ko modules get the passes natively
#
# Runners:
#   - x86_64: ubuntu-latest (KVM available)
#   - arm64:  ubuntu-24.04-arm (TCG only, no KVM on GitHub arm64 runners)
#
# Rust kernel modules only build on non-RT (CONFIG_PREEMPT_RT conflicts with CONFIG_RUST)
#
# What each job is expected to prove:
#   non-RT (CONFIG_RUST=y): all five test modules run and pass, and binderfs
#     too -- the binder driver in this tree is ANDROID_BINDER_IPC_RUST, which
#     "depends on RUST" (drivers/android/Kconfig), so binderfs exists only here.
#   RT (CONFIG_RUST unset): the kernel builds and boots, the ioctl interface
#     passes, and the three C modules (rust_ffi_contract, eight_struct_args_c,
#     pointee_access_c -- all unconditional obj-m) run and pass. The two Rust
#     modules and binderfs legitimately SKIP. An RT job going green therefore
#     does NOT mean the Rust side works; only the non-RT jobs can say that.
#
# Access records (CONFIG_KCOV_DATAFLOW_POINTEE_ACCESS[_VOLATILE|_ATOMIC]: the
# values a function loads and stores through its pointer arguments) are on in
# every job but one. x86_64-noaccess builds the same kernel with them off, the
# way rebuild-kselftest.sh does with KCOV_DF_ACCESS=0: the record stream must
# then be what it was before access records existed -- no ACCESS record, the
# same args/ret checks passing -- so the series stays usable without them.
#
# Every job also checks the records against the test modules' DWARF:
# test_modules.py resolves each one through "sancov -symbolize-dataflow" (the
# __sancov_dataflow descriptors plus DW_TAG_LLVM_sancov_observation) and
# compares the source parameters, struct members and pointee layouts with the
# ones the sources declare. The build job runs the LLVM tests of the passes,
# the codegen and sancov changes they rely on, and the compiler-rt end-to-end
# tests first, so a toolchain regression fails there rather than as a
# kselftest failure.
#
# Timeouts: the kcov_dataflow "settings" file asks for 300s per target, which
# is sized for KVM. The arm64 runners have no KVM, so everything runs under
# TCG and the heaviest target (test_modules.py: five module load/trigger/
# unload cycles against an INSTRUMENT_ALL kernel) runs several times longer.
# Each job therefore overrides the timeout explicitly rather than inheriting a
# value that silently kills a test mid-run.

name: kcov-dataflow kselftest

on:
  push:
    branches: [main, kcov-dataflow-*]
  pull_request:

jobs:
  # Stage 1: Build custom LLVM + rustc (per architecture)
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: X86
            rust-target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: AArch64
            rust-target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Clone submodules (shallow)
      run: git submodule update --init --depth 1 llvm-project rust

    - name: Install build deps
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld ninja-build cmake python3

    - name: Get submodule commits
      id: revs
      run: |
        echo "llvm=$(git rev-parse HEAD:llvm-project)" >> $GITHUB_OUTPUT
        echo "rust=$(git rev-parse HEAD:rust)" >> $GITHUB_OUTPUT

    - name: Cache LLVM build
      id: cache-llvm
      uses: actions/cache@v4
      with:
        path: llvm-project/build
        key: llvm-${{ matrix.arch }}-${{ steps.revs.outputs.llvm }}

    - name: Build custom LLVM
      if: steps.cache-llvm.outputs.cache-hit != 'true'
      run: |
        cd llvm-project
        cmake -S llvm -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DLLVM_ENABLE_LLD=ON \
          -DLLVM_ENABLE_PROJECTS="clang;lld" \
          -DLLVM_ENABLE_RUNTIMES="compiler-rt" \
          -DLLVM_TARGETS_TO_BUILD="${{ matrix.target }}"
        ninja -C build

    # The toolchain's own tests: the trace-args/trace-ret pass and its access
    # records (Instrumentation/SanitizerCoverage/trace-pointee-access*), the
    # codegen it relies on (!pcsections on calls, one entry per PC), the
    # DWARF tag, sancov (including access-record decoding and skipping
    # descriptors of an unknown version), the clang flags, the compiler-rt
    # runtime end to end, and libFuzzer's value profile. Run on a cache hit
    # too: they take a minute and say the cached build is sound. Tests for
    # the other architecture report UNSUPPORTED.
    - name: Test custom LLVM
      run: |
        cd llvm-project
        build/bin/llvm-lit -sv \
          llvm/test/Instrumentation/SanitizerCoverage \
          llvm/test/CodeGen/X86/pcsections-per-pc.ll \
          llvm/test/CodeGen/X86/pcsections-call.ll \
          llvm/test/CodeGen/AArch64/pcsections-per-pc.ll \
          llvm/test/CodeGen/AArch64/pcsections-call.ll \
          llvm/test/DebugInfo/X86/sancov-observation.ll \
          llvm/test/DebugInfo/AArch64/call-site-param-zero-register.ll \
          llvm/test/tools/sancov \
          clang/test/CodeGen/sanitizer-coverage-trace-args-ret.c \
          clang/test/Driver/fsanitize-coverage.c
        # lit finds a suite only from a directory with its own lit.site.cfg.py:
        # one per sanitizer configuration (asan-<arch>-Linux, ...), not their
        # parent.
        shopt -s nullglob
        configs=(build/runtimes/runtimes-bins/compiler-rt/test/sanitizer_common/*-Linux)
        if [ ${#configs[@]} -eq 0 ]; then
          echo "FAIL: no compiler-rt sanitizer_common test configurations"
          exit 1
        fi
        build/bin/llvm-lit -sv --filter='sanitizer_coverage_trace_(args|access)' "${configs[@]}"
        # libFuzzer folds trace-args/trace-ret values, and access records,
        # into its value profile. One suite per architecture
        # (X86_64DefaultLinuxConfig, AARCH64DefaultLinuxConfig).
        fuzzer=(build/runtimes/runtimes-bins/compiler-rt/test/fuzzer/*DefaultLinuxConfig)
        if [ ${#fuzzer[@]} -eq 0 ]; then
          echo "FAIL: no compiler-rt libFuzzer test configuration"
          exit 1
        fi
        build/bin/llvm-lit -sv --filter='trace-(args|pointee-access)-value-profile' "${fuzzer[@]}"

    - name: Cache Rust build
      id: cache-rust
      uses: actions/cache@v4
      with:
        path: rust/build/${{ matrix.rust-target }}/stage1
        key: rust-${{ matrix.arch }}-${{ steps.revs.outputs.rust }}-${{ steps.revs.outputs.llvm }}

    - name: Build custom rustc (stage1)
      if: steps.cache-rust.outputs.cache-hit != 'true'
      run: |
        cd rust
        cat > config.toml << EOF
        [llvm]
        download-ci-llvm = false
        [build]
        target = ["${{ matrix.rust-target }}"]
        docs = false
        extended = false
        [target.${{ matrix.rust-target }}]
        llvm-config = "$PWD/../llvm-project/build/bin/llvm-config"
        cc = "$PWD/../llvm-project/build/bin/clang"
        cxx = "$PWD/../llvm-project/build/bin/clang++"
        [rust]
        codegen-backends = ["llvm"]
        debug-assertions = false
        channel = "nightly"
        EOF
        python3 x.py build --stage 1 library

    - name: Upload toolchain
      uses: actions/upload-artifact@v4
      with:
        name: toolchain-${{ matrix.arch }}
        path: |
          llvm-project/build/bin
          llvm-project/build/lib
          rust/build/${{ matrix.rust-target }}/stage1
        retention-days: 1

  # Stage 2: Build kernel and run selftests
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            arch: x86_64
            runner: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            rt: false
            access: true
            # KVM: the 300s in the kselftest settings file is adequate, but be
            # explicit so the value does not depend on the runner image.
            timeout: 600
          - name: x86_64-rt
            arch: x86_64
            runner: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            rt: true
            access: true
            timeout: 600
          # Access records compiled out; see the header.
          - name: x86_64-noaccess
            arch: x86_64
            runner: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            rt: false
            access: false
            timeout: 600
          - name: arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            rt: false
            access: true
            # No KVM on GitHub arm64 runners, so this is TCG. Measured under
            # KVM the three targets take ~70s of guest time; give TCG room
            # rather than have test_modules.py killed on its last module.
            timeout: 1800
          - name: arm64-rt
            arch: arm64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            rt: true
            access: true
            timeout: 1800
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Clone linux submodule (shallow)
      run: git submodule update --init --depth 1 linux rust

    - name: Download toolchain
      uses: actions/download-artifact@v4
      with:
        name: toolchain-${{ matrix.arch }}

    - name: Fix permissions
      run: |
        chmod +x llvm-project/build/bin/*
        chmod +x rust/build/${{ matrix.rust-target }}/stage1/bin/*

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential bc flex bison libelf-dev libssl-dev \
          python3 qemu-system libdw-dev zstd
        # Rustup + bindgen for CONFIG_RUST kernel build
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        source "$HOME/.cargo/env"
        cargo install bindgen-cli
        # virtme-ng for kernel boot testing
        python3 -m venv venv-virtme
        source venv-virtme/bin/activate
        pip3 install git+https://github.com/arighi/virtme-ng.git

    - name: Enable KVM
      if: matrix.arch == 'x86_64'
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Build kernel (${{ matrix.name }})
      run: |
        set -o pipefail
        export PATH="$PWD/llvm-project/build/bin:$PATH"
        export RUSTC="$PWD/rust/build/${{ matrix.rust-target }}/stage1/bin/rustc"
        export RUST_LIB_SRC="$PWD/rust/library"
        source venv-virtme/bin/activate
        cd linux

        EXTRA_CONFIGS=""
        if [ "${{ matrix.rt }}" = "true" ]; then
          EXTRA_CONFIGS="--configitem CONFIG_PREEMPT_RT=y"
        fi
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          # Disable 32-bit compat to avoid needing ARM LLVM target for vdso32
          EXTRA_CONFIGS="$EXTRA_CONFIGS --configitem CONFIG_COMPAT=n"
          # Upstream clang 22287cb04839 ("[Clang][AArch64] Diagnose invalid
          # FPM scale arguments"), in the LLVM base, declares the
          # __arm_set_fpm_*scale builtins in arm_vector_types.h with
          # uint64_t/int64_t. asm/neon-intrinsics.h redefines
          # __UINT64_TYPE__/__INT64_TYPE__ as long long before including
          # arm_neon.h, so every file using NEON intrinsics fails with
          # "conflicting types for '__arm_set_fpm_lscale'". Leave those files
          # out -- none of them is what this pipeline tests -- until clang
          # is fixed:
          #   lib/crc/crc64-neon.c            CRC_OPTIMIZATIONS (needs EXPERT)
          #   lib/raid/xor/*                  XOR_BLOCKS, ASYNC_XOR
          #   lib/raid/raid6/arm/recov_neon*  RAID6_PQ (btrfs, md raid456)
          #   crypto/aegis128-neon-inner.c    CRYPTO_AEGIS128
          for c in CONFIG_EXPERT=y CONFIG_CRC_OPTIMIZATIONS=n \
                   CONFIG_BTRFS_FS=n CONFIG_MD_RAID456=n CONFIG_ASYNC_XOR=n \
                   CONFIG_XOR_BLOCKS=n CONFIG_RAID6_PQ=n CONFIG_CRYPTO_AEGIS128=n; do
            EXTRA_CONFIGS="$EXTRA_CONFIGS --configitem $c"
          done
        fi

        # Rust only on non-RT. The binder driver in this tree is Rust-only
        # (config ANDROID_BINDER_IPC_RUST, drivers/android/Kconfig) and
        # "depends on RUST", so it is enabled here and nowhere else. There is
        # no ANDROID_BINDER_IPC or ANDROID_BINDERFS symbol in this tree; asking
        # for those is silently ignored by vng, which is how the binderfs
        # selftest came to SKIP in every job.
        RUST_CONFIGS=""
        if [ "${{ matrix.rt }}" != "true" ] && \
           make LLVM=1 RUSTC=$RUSTC RUST_LIB_SRC=$RUST_LIB_SRC rustavailable 2>/dev/null; then
          RUST_CONFIGS="--configitem CONFIG_RUST=y"
          RUST_CONFIGS="$RUST_CONFIGS --configitem CONFIG_ANDROID_BINDER_IPC_RUST=y"
        fi

        # Access records: on, or explicitly off for the noaccess job (they
        # default to n, but say which, so a default change cannot flip the
        # job's meaning).
        ACCESS_CONFIGS=""
        for s in CONFIG_KCOV_DATAFLOW_POINTEE_ACCESS \
                 CONFIG_KCOV_DATAFLOW_POINTEE_ACCESS_VOLATILE \
                 CONFIG_KCOV_DATAFLOW_POINTEE_ACCESS_ATOMIC; do
          if [ "${{ matrix.access }}" = "true" ]; then
            ACCESS_CONFIGS="$ACCESS_CONFIGS --configitem $s=y"
          else
            ACCESS_CONFIGS="$ACCESS_CONFIGS --configitem $s=n"
          fi
        done

        vng --build \
          --configitem CONFIG_KCOV=y \
          --configitem CONFIG_KCOV_DATAFLOW_ARGS=y \
          --configitem CONFIG_KCOV_DATAFLOW_RET=y \
          --configitem CONFIG_KCOV_DATAFLOW_INSTRUMENT_ALL=y \
          --configitem CONFIG_KCOV_DATAFLOW_NO_INLINE=y \
          --configitem CONFIG_DEBUG_INFO=y \
          --configitem CONFIG_DEBUG_INFO_REDUCED=n \
          --configitem CONFIG_WERROR=y \
          $ACCESS_CONFIGS \
          $RUST_CONFIGS \
          $EXTRA_CONFIGS \
          LLVM=1 CC=clang RUSTC=$RUSTC RUST_LIB_SRC=$RUST_LIB_SRC \
          2>&1 | tee /tmp/kernel_build.txt

    # The descriptors the compiler emits next to every trace call
    # (__sancov_dataflow) need a rule in vmlinux.lds.h -- an orphan section
    # is a link error under WERROR -- one output section per module, or the
    # loader fails with -EEXIST, and objtool's IBT check must skip them: they
    # point at call instructions, never at an indirect branch target. A
    # warning here is one per instrumented call, so check for any at all.
    - name: Verify the observation descriptors
      run: |
        rc=0
        if grep -E "__sancov_dataflow.*(data relocation|is being placed)" /tmp/kernel_build.txt | head -5 | grep .; then
          echo "FAIL: build warnings about __sancov_dataflow"
          rc=1
        fi
        if llvm-project/build/bin/llvm-readelf -S linux/vmlinux | grep -q " __sancov_dataflow "; then
          echo "ok      vmlinux has __sancov_dataflow"
        else
          echo "MISSING __sancov_dataflow in vmlinux"
          rc=1
        fi
        exit $rc

    # CONFIG_KCOV_DATAFLOW_* carry
    #   depends on !RUST || $(rustc-option,-Cllvm-args=-sanitizer-coverage-...)
    # which fails open: a make that does not see RUSTC in its environment
    # probes the default rustc, the dependency goes unmet, and every symbol is
    # dropped from .config with no diagnostic. Read them back rather than
    # trusting that --configitem took effect.
    #
    # The DWARF version is read from vmlinux rather than from .config: vng
    # appends CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y after the
    # --configitem values, so that member of the "Debug information" choice
    # always wins over a requested CONFIG_DEBUG_INFO_DWARF5=y. clang's default
    # is DWARF 5, which is what is checked.
    - name: Verify kernel config
      run: |
        cd linux
        rc=0
        for s in CONFIG_KCOV CONFIG_KCOV_DATAFLOW_ARGS CONFIG_KCOV_DATAFLOW_RET \
                 CONFIG_KCOV_DATAFLOW_INSTRUMENT_ALL CONFIG_KCOV_DATAFLOW_NO_INLINE \
                 CONFIG_DEBUG_INFO CONFIG_WERROR; do
          if grep -q "^$s=y" .config; then
            echo "ok      $s=y"
          else
            echo "MISSING $s"
            rc=1
          fi
        done
        if grep -qE "^CONFIG_DEBUG_INFO_(DWARF5|DWARF_TOOLCHAIN_DEFAULT)=y" .config; then
          echo "ok      $(grep -E "^CONFIG_DEBUG_INFO_DWARF" .config)"
        else
          echo "MISSING CONFIG_DEBUG_INFO_DWARF5 or CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT"
          rc=1
        fi
        # An int with the same fail-open rustc-option dependency: absent, the
        # compiler default applies, but the selftests expect snapshots on.
        if grep -qE "^CONFIG_KCOV_DATAFLOW_POINTEE_BYTES=[1-9]" .config; then
          echo "ok      $(grep "^CONFIG_KCOV_DATAFLOW_POINTEE_BYTES=" .config)"
        else
          echo "MISSING CONFIG_KCOV_DATAFLOW_POINTEE_BYTES (pointee snapshots off)"
          rc=1
        fi
        # The access options carry the same fail-open cc-option/rustc-option
        # dependency, so read them back too -- both ways: a noaccess job that
        # silently had them on would not test what it claims to.
        for s in CONFIG_KCOV_DATAFLOW_POINTEE_ACCESS \
                 CONFIG_KCOV_DATAFLOW_POINTEE_ACCESS_VOLATILE \
                 CONFIG_KCOV_DATAFLOW_POINTEE_ACCESS_ATOMIC; do
          if [ "${{ matrix.access }}" = "true" ]; then
            if grep -q "^$s=y" .config; then
              echo "ok      $s=y"
            else
              echo "MISSING $s"
              rc=1
            fi
          elif grep -q "^$s=y" .config; then
            echo "UNEXPECTED $s=y on an access-off build"
            rc=1
          else
            echo "ok      $s unset"
          fi
        done
        v=$(../llvm-project/build/bin/llvm-dwarfdump --debug-info vmlinux 2>/dev/null |
            grep -m1 -o "version = 0x000[0-9]") || true
        if [ "$v" = "version = 0x0005" ]; then
          echo "ok      vmlinux DWARF $v"
        else
          echo "MISSING DWARF 5 in vmlinux (${v:-no compile unit found})"
          rc=1
        fi
        if [ "${{ matrix.rt }}" != "true" ]; then
          for s in CONFIG_RUST CONFIG_ANDROID_BINDER_IPC_RUST; do
            if grep -q "^$s=y" .config; then
              echo "ok      $s=y"
            else
              echo "MISSING $s (expected on a non-RT build)"
              rc=1
            fi
          done
        fi
        exit $rc

    - name: Build selftests
      run: |
        export PATH="$PWD/llvm-project/build/bin:$PATH"
        export RUSTC="$PWD/rust/build/${{ matrix.rust-target }}/stage1/bin/rustc"
        export RUST_LIB_SRC="$PWD/rust/library"
        cd linux

        MAKE_ARGS="LLVM=1 CC=clang RUSTC=$RUSTC RUST_LIB_SRC=$RUST_LIB_SRC"

        # Install the uapi headers (the C tests include <linux/kcov_dataflow.h>),
        # then let kselftest build the programs and, via Kbuild against this
        # tree, the test modules (the Rust ones only with CONFIG_RUST=y), and
        # install everything next to a generated run_kselftest.sh.
        make $MAKE_ARGS headers
        make -C tools/testing/selftests TARGETS=kcov_dataflow $MAKE_ARGS \
          install INSTALL_PATH=$PWD/kselftest-install
        ls -l kselftest-install/kcov_dataflow
        # One descriptor section per module, which sancov can resolve.
        for ko in kselftest-install/kcov_dataflow/*.ko; do
          n=$(../llvm-project/build/bin/llvm-readelf -S "$ko" | grep -c " __sancov_dataflow ")
          echo "$ko: $n __sancov_dataflow section(s)"
          [ "$n" = 1 ] || exit 1
          ../llvm-project/build/bin/sancov -symbolize-dataflow "$ko" > /dev/null
        done

    # The guest sees the host's file system, so test_modules.py can run the
    # toolchain's sancov for its DWARF checks.
    - name: Run selftests
      run: |
        source venv-virtme/bin/activate
        cd linux
        vng --user root --verbose \
          --exec "env SANCOV=$PWD/../llvm-project/build/bin/sancov $PWD/kselftest-install/run_kselftest.sh -o ${{ matrix.timeout }} -c kcov_dataflow" \
          2>&1 | tee /tmp/kselftest_result.txt

    # --- Results ---

    - name: Report results
      if: always()
      run: |
        echo "============================================"
        echo "  KCOV-DATAFLOW RESULTS: ${{ matrix.name }}"
        echo "============================================"
        grep -E "^(ok|not ok|# (ok|not ok|Totals|FAIL|TIMEOUT|selftests:))|# TIMEOUT" \
          /tmp/kselftest_result.txt 2>/dev/null || echo "MISSING"
        echo "============================================"
        grep -E "^# # [a-z_]+: DWARF: |^# # DWARF: " /tmp/kselftest_result.txt 2>/dev/null || true
        grep -E "^# # [a-z_]+: access records " /tmp/kselftest_result.txt 2>/dev/null || true

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kselftest-${{ matrix.name }}
        path: |
          /tmp/kselftest_result.txt
          /tmp/kernel_build.txt
          linux/.config
        retention-days: 14

    # Note on matching: a kernel printk can land in the middle of a TAP line,
    # e.g. "# ok 2 k[   18.3] workqueue: ... deprecated workqueue". Patterns
    # here are therefore anchored at the start only -- never with a trailing
    # $ -- so console noise cannot turn a passing run into a reported failure.
    - name: Verify pass
      run: |
        R=/tmp/kselftest_result.txt

        fail() { echo "FAIL: $*"; exit 1; }

        # A killed target reports TIMEOUT and leaves its remaining subtests
        # with no result at all; say so instead of blaming the subtest.
        if grep -qE "# TIMEOUT [0-9]+ seconds" $R; then
          echo "--- timed out ---"
          grep -E "# TIMEOUT" $R
          fail "a test target exceeded the ${{ matrix.timeout }}s timeout"
        fi

        for t in user_ioctl binderfs_test test_modules.py; do
          grep -qE "^ok [0-9]+ selftests: kcov_dataflow: $t" $R || \
            fail "$t did not report ok"
        done

        # The DWARF checks need sancov in the guest; skipped, they leave the
        # mapping of records to source parameters unverified.
        if grep -q "DWARF checks skipped" $R; then
          fail "DWARF source map checks did not run (no sancov in the guest)"
        fi

        if grep -qE "^(# )?not ok" $R; then
          echo "--- failing cases ---"
          grep -E "^(# )?not ok" $R
          fail "failing test case"
        fi

        # Modules that are unconditional obj-m (all three are C) must run in
        # every configuration, RT included.
        for m in rust_ffi_contract eight_struct_args_c pointee_access_c; do
          grep -qE "^# ok [0-9]+ $m" $R || fail "module $m did not report ok"
          if grep -qE "^# ok [0-9]+ $m.*# SKIP" $R; then
            fail "module $m was skipped"
          fi
        done

        # What test_modules.py expects of a module follows from what its
        # __sancov_dataflow descriptors say it was compiled to record, so a
        # module built without access records would pass its checks on an
        # access job too. Pin that to the job: every module that ran says
        # "compiled in" (with records from pointee_access_c, which exists for
        # them) on an access job and "not compiled in, 0 recorded" otherwise.
        ran=$(grep -cE "^# # [a-z_]+: access records " $R || true)
        [ "$ran" -gt 0 ] || fail "no module reported its access records"
        if [ "${{ matrix.access }}" = "true" ]; then
          if grep -E "^# # [a-z_]+: access records not compiled in" $R; then
            fail "a module was built without access records on an access build"
          fi
          grep -qE "^# # pointee_access_c: access records compiled in, [1-9][0-9]* recorded" $R || \
            fail "pointee_access_c recorded no access records"
        else
          if grep -E "^# # [a-z_]+: access records compiled in" $R; then
            fail "a module was built with access records on an access-off build"
          fi
          if grep -E "^# # [a-z_]+: access records not compiled in, [1-9]" $R; then
            fail "ACCESS records recorded on an access-off build"
          fi
        fi

        # The Rust modules are obj-$(CONFIG_RUST), so they are only required
        # where Rust is enabled. Scoped to module names on purpose: binderfs
        # SKIPping is legitimate on an RT build, and the old blanket
        # "no SKIP anywhere" check matched those lines and failed every job.
        if grep -q "^CONFIG_RUST=y" linux/.config; then
          for m in eight_struct_args_rust rust_kworker_remote; do
            grep -qE "^# ok [0-9]+ $m" $R || fail "module $m did not report ok"
            if grep -qE "^# ok [0-9]+ $m.*# SKIP" $R; then
              fail "module $m was skipped on a CONFIG_RUST=y build"
            fi
          done
          grep -qE "^# ok [0-9]+ kcov_dataflow.binderfs_setup" $R || \
            fail "binderfs did not run on a CONFIG_ANDROID_BINDER_IPC_RUST=y build"
        else
          echo "note: CONFIG_RUST unset (RT build) -- Rust modules and"
          echo "      binderfs are expected to SKIP; this job does not"
          echo "      validate the Rust side."
        fi

        echo "All tests passed (${{ matrix.name }})"
